# Identity and per-target dependency versions.
#
# Build scripts flatten the section matching the current node with
# `stonecutter.properties.tags(mcVersion, loader)`, so `[neoforge."26.3"] deps.neoforge`
# is readable as the plain Gradle property `deps.neoforge` on that node.
#
# Versions checked against the NeoForged, Fabric and Mojang metadata on 16.10.2026.

mod.id = "kolobok"
mod.name = "The Tale of Kolobok"
mod.group = "ru.bagomot.kolobok"
mod.version = "1.3.0"
mod.license = "MIT"
mod.author = "Bagomot"
mod.sources = "https://github.com/bagomot/kolobok"
mod.description = "Колобок из восточнославянской сказки: печётся в русской печи, ходит за хозяином, поёт и уходит от всех. A bread pet from the East Slavic fairy tale."

java.version = "25"

deps.junit = "5.11.4"

# Publishing, `./gradlew publishMods`. Each platform's project id, as its project page shows it;
# empty skips that platform. The tokens are never kept here: they come from the environment or
# a git-ignored .env.
publish.modrinth = ""
publish.curseforge = ""
# release, beta or alpha
publish.type = "release"

# Soft integrations: compiled against, never shipped or required. Versions checked against the
# BlameJared, Shedaniel and Modrinth Mavens on 25.10.2026; EMI and Patchouli have no 26.3 build.
deps.jei = "31.17.0.93"
deps.rei = "26.3.824"
deps.cloth_math = "0.6.1"
deps.architectury = "22.0.5"
# Modonomicon's own version on both loaders; deps.modonomicon below is the Modrinth id of its file.
deps.modonomicon_version = "2.17.1"

# ---------------------------------------------------------------- Fabric

[fabric]
deps.fabric_loader = "0.20.0"

[fabric."26.3"]
deps.minecraft = "26.3"
deps.minecraft_range = ">=26.3 <26.4"
deps.fabric_api = "0.162.0+26.3"
deps.jade = "26.3.5+fabric"
# Modrinth version id of modonomicon-26.3-fabric-2.17.1, only for trying the book in a dev run.
deps.modonomicon = "u5mJ3wYn"

# ---------------------------------------------------------------- NeoForge

[neoforge."26.3"]
deps.minecraft = "26.3"
deps.minecraft_range = "[26.3,26.4)"
deps.neoforge = "26.3.0.85"
deps.neoforge_range = "[26.3.0.85,)"
deps.jade = "26.3.5+neoforge"
# Modrinth version id of modonomicon-26.3-neoforge-2.17.1, only for trying the book in a dev run.
deps.modonomicon = "JBJ5eClB"
