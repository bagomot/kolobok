# A pushed tag v<version> releases that version. The jars are built and tested, and the commit
# must be the clean, tagged release of that version (checkRelease). Both jars then go to Modrinth
# and CurseForge, each only when its project id is set in stonecutter.properties.toml (the tokens
# come from the repository's secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN), and to a GitHub release
# with the version's CHANGELOG.md section as its notes. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and check the release
        run: ./gradlew checkRelease
      - name: Publish to Modrinth and CurseForge
        run: ./gradlew publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v head="## $version" 'index($0, head) == 1 { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > "$notes"
          prerelease=()
          grep -Eq '^publish\.type = "(beta|alpha)"' stonecutter.properties.toml && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" versions/*/build/libs/*-"$version".jar \
            --verify-tag --title "Kolobok $version" --notes-file "$notes" "${prerelease[@]}"
