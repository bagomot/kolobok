# Mod identity and dependency versions live in stonecutter.properties.toml, because they vary
# per build node. This file holds Gradle settings only.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Stonecutter rewrites sources between nodes, which the configuration cache does not model well.
org.gradle.configuration-cache=false
