modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "${mod_sources}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
displayURL = "${mod_sources}"
description = '''${mod_description}'''
iconFile = "assets/${mod_id}/icon.png"

[[mixins]]
config = "kolobok.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# Soft integrations: never needed, but an older version than the one compiled against is refused.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "${rei_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "${jade_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "modonomicon"
type = "optional"
versionRange = "${modonomicon_range}"
ordering = "NONE"
side = "BOTH"
